# Pushing a tag like v1.2.0 builds MailBrief.exe, publishes the GitHub release and sends the new version to winget.
# Start it with:  .\release.ps1 1.2.0
name: Release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: ['mailbrief/__init__.py']

permissions:
  contents: write          # create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify JavaScript runtime
        run: node --version

      - name: Tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Resolve and validate the release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $code = python -c "import mailbrief; print(mailbrief.__version__)"
          if ($code -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$code") { throw 'Tag and code version differ' }
          "VERSION=$code" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$code" >> $env:GITHUB_ENV
          gh release view "v$code" --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          "publish=$((-not $exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Lint
        if: steps.version.outputs.publish == 'true'
        run: python -m pyflakes main.py mailbrief tests

      - name: Tests
        if: steps.version.outputs.publish == 'true'
        run: python -m unittest discover -s tests

      - name: Build MailBrief application folder
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}     # the built-in Google sign-in key (set-google-key.ps1)
          MICROSOFT_CLIENT_JSON: ${{ secrets.MICROSOFT_CLIENT_JSON }}   # the built-in Microsoft Application ID (set-microsoft-key.ps1)
        run: |
          # --specpath build makes relative paths resolve inside build\ - so the icon and data files get full paths
          $data = @('--add-data', "$((Resolve-Path THIRD-PARTY-NOTICES.txt).Path);.")
          if ($env:GOOGLE_CLIENT_JSON) {
            [IO.File]::WriteAllText("$PWD\google_client.json", $env:GOOGLE_CLIENT_JSON)
            $data += @('--add-data', "$PWD\google_client.json;.")
            Write-Host 'Built-in Google key: yes'
          } else { Write-Host '::warning::No GOOGLE_CLIENT_JSON secret - users will have to set up their own Google key' }
          if ($env:MICROSOFT_CLIENT_JSON) {
            [IO.File]::WriteAllText("$PWD\microsoft_client.json", $env:MICROSOFT_CLIENT_JSON)
            $data += @('--add-data', "$PWD\microsoft_client.json;.")
            Write-Host 'Built-in Microsoft key: yes'
          } else { Write-Host '::warning::No MICROSOFT_CLIENT_JSON secret - users will have to set up their own Microsoft key' }
          pyinstaller --onedir --noconsole --noupx --clean --name MailBrief --icon (Resolve-Path assets/mailbrief.ico).Path @data `
            --paths . --distpath dist --workpath build --specpath build --noconfirm --log-level WARN main.py
          Remove-Item google_client.json, microsoft_client.json -ErrorAction SilentlyContinue
          if ($LASTEXITCODE) { throw 'PyInstaller failed' }

      - name: Sign MailBrief.exe when a certificate is configured
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE) { Write-Host '::notice::No Windows signing certificate configured'; exit 0 }
          $certificate = Join-Path $env:RUNNER_TEMP 'mailbrief-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe was not found' }
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD dist\MailBrief\MailBrief.exe
          if ($LASTEXITCODE) { throw 'Signing MailBrief.exe failed' }
          Remove-Item -LiteralPath $certificate -Force

      - name: Build the installer (MailBrief-Setup.exe)
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # Microsoft's small WebView2 installer: the setup runs it only on a computer without WebView2
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile installer\MicrosoftEdgeWebview2Setup.exe -UseBasicParsing
          if ((Get-AuthenticodeSignature installer\MicrosoftEdgeWebview2Setup.exe).SignerCertificate.Subject -notmatch 'Microsoft') { throw 'WebView2 installer is not signed by Microsoft' }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\mailbrief.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }

      - name: Sign installer and create portable ZIP
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ($env:WINDOWS_SIGNING_CERTIFICATE) {
            $certificate = Join-Path $env:RUNNER_TEMP 'mailbrief-signing.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'signtool.exe was not found' }
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD dist\MailBrief-Setup.exe
            if ($LASTEXITCODE) { throw 'Signing MailBrief-Setup.exe failed' }
            Remove-Item -LiteralPath $certificate -Force
          }
          Compress-Archive -Path dist\MailBrief\* -DestinationPath dist\MailBrief-Portable.zip -CompressionLevel Optimal

      - name: Check the EXE
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $exe = 'dist\MailBrief\MailBrief.exe'
          if ((Get-Item $exe).Length -lt 500KB) { throw 'MailBrief.exe is suspiciously small' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))[0..1]
          if ([Text.Encoding]::ASCII.GetString($bytes) -ne 'MZ') { throw 'MailBrief.exe is not a Windows program' }
          Write-Host "SHA256 $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          $folderSize = (Get-ChildItem dist\MailBrief -File -Recurse | Measure-Object Length -Sum).Sum
          if ($folderSize -lt 10MB) { throw 'MailBrief application folder is incomplete' }
          if ((Get-Item dist\MailBrief-Portable.zip).Length -lt 5MB) { throw 'MailBrief-Portable.zip is suspiciously small' }
          if ((Get-Item dist\MailBrief-Setup.exe).Length -lt 5MB) { throw 'MailBrief-Setup.exe is suspiciously small' }
          if ($env:WINDOWS_SIGNING_CERTIFICATE -and (Get-AuthenticodeSignature $exe).Status -ne 'Valid') { throw 'MailBrief.exe signature is not valid' }
          if ($env:WINDOWS_SIGNING_CERTIFICATE -and (Get-AuthenticodeSignature dist\MailBrief-Setup.exe).Status -ne 'Valid') { throw 'Installer signature is not valid' }
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}

      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **התקנה:** להוריד את ``MailBrief-Setup.exe`` למטה ולהריץ (בלי הרשאות מנהל) · או ``winget install mailbrief`` · או לחלץ את ``MailBrief-Portable.zip`` לגרסה ניידת.
          מי שכבר מותקן יקבל בתוכנה הודעה וקישור להורדת הגרסה החדשה.

          **מה חדש בגרסה הזו:**
          - תיבה נפרדת לכל כתובת, עם חיפושים שמורים ומסננים מהירים.
          - ערכות צבעים, כרטיסים, תקצירים מורחבים וניווט עליון מכווץ.
          - פרופילי שולחים עם היסטוריית התכתבות והערות אישיות מקומיות לכל תיבה.
          - מסך מעקב שליחה ותשובות לפי המידע שנשמר ב-MailBrief (אינו אישור קריאה).
          - פעולות קריאה מהירות, ייצוא CSV, חיפוש לפי שולח ועזרת מקלדת.
          - תיקוני חיפוש בחלונות נפרדים והגנה משמירת הערה ישנה מעל עדכון מחלון אחר.

          > אם אישור החתימה אינו מוגדר עדיין, Windows SmartScreen עדיין עשוי להציג אזהרת מוניטין לקובץ חדש.
          "@
          gh release create $env:RELEASE_TAG dist/MailBrief-Setup.exe dist/MailBrief-Portable.zip --target '${{ github.sha }}' --title "MailBrief $env:VERSION" --notes $notes --generate-notes

      - name: Send the new version to winget
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host '::notice::No WINGET_TOKEN secret - skipping winget (see RELEASING.md)'; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/MailBrief-Setup.exe"
          .\wingetcreate.exe update MailBrief.App --version $env:VERSION --urls $url --submit --token $env:WINGET_TOKEN
